<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻訳</title><link rel="icon" href="icons/kotoba.svg" type="image/svg+xml"><link rel="stylesheet" href="ui.css"><script src="core.js" defer></script><script src="popup.js" defer></script></head>
<body class="popup"><main>
  <header class="header"><h1 class="brand"><img src="icons/kotoba.svg" width="26" height="26" alt="">翻訳</h1><button class="icon" id="options" aria-label="設定" title="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.4-2.1 1.2L4 6l-2 3.5 1.7 1.8v2.4L2 15.5 4 19l2.3-.6 2.1 1.2L9 22h4l.6-2.4 2.1-1.2 2.3.6 2-3.5-1.7-1.8v-2.4L20 9.5 18 6l-2.3.6-2.1-1.2L13 3Z" transform="translate(1 -1) scale(.95)"/><circle cx="12" cy="11.5" r="3"/></svg></button></header>
  <div class="language-row"><label>原文<select id="source"></select></label><button id="swap" class="icon" aria-label="言語を入れ替える" title="言語を入れ替える"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/></svg></button><label>訳文<select id="target"></select></label></div>
  <button class="primary full" id="start" disabled><svg class="start-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h11l5 5v13H4Z M14 3v6h6M8 13h8M8 17h5"/></svg><svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg><span id="start-label">ページを翻訳</span></button>
  <div class="actions"><button id="selection" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M7 9h10M7 15h7"/></svg>選択範囲を翻訳</button><button id="restore" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4-5 5 5 5M3 9h10a6 6 0 0 1 0 12"/></svg>原文に戻す</button></div>
  <label class="switch-row" for="hover">ホバーで原文を表示<input id="hover" type="checkbox" role="switch" checked></label>
  <label class="switch-row" for="batch-translation">複数の段落をまとめて翻訳<input id="batch-translation" type="checkbox" role="switch" checked></label>
  <label class="switch-row" for="main-content-only">本文だけを翻訳<input id="main-content-only" type="checkbox" role="switch"></label>
  <section class="progress" id="progress-section" hidden aria-label="翻訳の進捗">
    <div class="progress-label"><span id="progress-label">翻訳中</span><strong id="percent">0%</strong></div>
    <div class="progress-track"><progress id="progress" max="100" value="0" aria-label="翻訳の進捗"></progress><div class="progress-pending" id="progress-pending" hidden aria-hidden="true"></div></div>
    <div class="progress-detail"><span id="counts"></span><span id="elapsed"></span></div>
    <div class="progress-activity" id="progress-activity" hidden><span id="work"></span><span id="phase"></span></div>
  </section>
  <p id="status" role="status" aria-live="polite">ページを確認しています…</p>
  <div class="actions"><button id="dictionary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C9 3 6 3 3 4v16c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v16"/></svg>翻訳辞書</button><button id="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5v5h5M3 10a9 9 0 1 1 1 7M12 7v6l4 2"/></svg>翻訳の履歴</button></div>
  <button class="full" id="reload" hidden>ページを再読み込み</button>
</main></body></html>
