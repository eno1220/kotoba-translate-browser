<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻訳</title><link rel="stylesheet" href="ui.css"><script src="core.js" defer></script><script src="popup.js" defer></script></head>
<body class="popup"><main>
  <header class="header"><h1>翻訳</h1><button class="icon" id="options" aria-label="設定" title="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.4-2.1 1.2L4 6l-2 3.5 1.7 1.8v2.4L2 15.5 4 19l2.3-.6 2.1 1.2L9 22h4l.6-2.4 2.1-1.2 2.3.6 2-3.5-1.7-1.8v-2.4L20 9.5 18 6l-2.3.6-2.1-1.2L13 3Z" transform="translate(1 -1) scale(.95)"/><circle cx="12" cy="11.5" r="3"/></svg></button></header>
  <div class="language-row"><label>原文<select id="source"></select></label><button id="swap" class="icon" aria-label="言語を入れ替える" title="言語を入れ替える"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/></svg></button><label>訳文<select id="target"></select></label></div>
  <button class="primary full" id="start" disabled>ページを翻訳</button>
  <div class="actions"><button id="selection" disabled>選択範囲を翻訳</button><button id="restore" disabled>原文に戻す</button></div>
  <label class="switch-row" for="hover">ホバーで原文を表示<input id="hover" type="checkbox" role="switch" checked></label>
  <label class="switch-row" for="batch-translation">複数の段落をまとめて翻訳<input id="batch-translation" type="checkbox" role="switch" checked></label>
  <section class="progress" id="progress-section" hidden aria-label="翻訳の進捗">
    <div class="progress-label"><span id="progress-label">翻訳中</span><strong id="percent">0%</strong></div>
    <progress id="progress" max="100" value="0" aria-label="翻訳の進捗"></progress>
    <div class="progress-detail"><span id="counts"></span><span id="elapsed"></span></div>
  </section>
  <p id="status" role="status" aria-live="polite">ページを確認しています…</p>
  <button class="full" id="reload" hidden>ページを再読み込み</button>
</main></body></html>
