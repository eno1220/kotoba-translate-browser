<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻訳の設定</title><link rel="stylesheet" href="ui.css"><script src="core.js" defer></script><script src="options.js" defer></script></head>
<body><main>
  <h1>翻訳の設定</h1>
  <form id="settings">
    <fieldset><legend>接続先</legend>
      <div class="row"><label>サーバURL<input name="endpoint" type="url" required placeholder="http://127.0.0.1" spellcheck="false"></label><label class="port">ポート<input name="port" inputmode="numeric" placeholder="8000"><small>空欄でURLの値</small></label></div>
      <label>APIパス<input name="path" required placeholder="/v1/chat/completions" spellcheck="false"></label>
      <label>APIキー<input name="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="認証なしの場合は空欄"><small>Bearer認証。設定はこのFirefoxに保存されます。</small></label>
      <label>モデル<input name="model" required spellcheck="false"></label>
      <label>API形式<select name="apiFormat"><option value="top-level">トップレベル</option><option value="template">chat_template_kwargs（llama.cpp / vLLM）</option></select></label>
    </fieldset>
    <fieldset><legend>既定の翻訳</legend>
      <div class="row"><label>原文<select name="source"></select></label><label>訳文<select name="target"></select></label></div>
      <label>日本語の文体<select name="form"><option value="">指定なし</option><option value="plain">常体（だ・である）</option><option value="polite">敬体（です・ます）</option></select></label>
    </fieldset>
    <details class="advanced"><summary>詳細設定</summary>
      <div class="row"><label>同時リクエスト<input name="concurrency" type="number" min="1" max="8" required><small>全タブ共通</small></label><label>タイムアウト（秒）<input name="timeoutSeconds" type="number" min="10" max="1800" required></label></div>
      <label>入力上限（トークン）<input name="inputTokens" type="number" min="128" max="3900" required><small>出力上限：8096トークン</small></label>
      <label>トークン計測<select name="tokenizer"><option value="bytes">UTF-8バイト数で見積もり</option><option value="llama">llama.cpp /tokenize</option><option value="vllm">vLLM /tokenize</option></select><small>実測にはサーバの /tokenize API が必要です。</small></label>
      <label>Tokenizeパス<input name="tokenizePath" required placeholder="/tokenize" spellcheck="false"></label>
    </details>
    <div class="save-row"><button type="submit" class="primary">保存</button><p id="status" role="status" aria-live="polite"></p></div>
  </form>
</main></body></html>
