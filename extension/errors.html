<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>エラー記録</title><link rel="icon" href="icons/kotoba.svg" type="image/svg+xml"><link rel="stylesheet" href="ui.css"><script src="errors.js" defer></script></head>
<body class="settings"><main>
  <header class="header"><h1>エラー記録</h1><a href="options.html">設定</a></header>
  <p>翻訳に失敗した箇所と、再試行前の問題を新しい順に表示します。原文やサーバーの応答を含むため、JSONを共有する前に内容を確認してください。</p>
  <p><small>キャッシュとは独立して最大100件・4MiBを保存し、超過時は古い記録から削除します。各文字列は32000文字までです。APIキーは除去し、プライベートウィンドウと停止操作は記録しません。</small></p>
  <div class="history-actions"><button id="refresh" type="button">更新</button><button id="export" type="button" disabled>JSONを保存</button><button id="clear" type="button" disabled>エラー記録を全件削除</button></div>
  <p id="status" role="status" aria-live="polite">読み込んでいます…</p>
  <div id="entries"></div>
</main></body></html>
